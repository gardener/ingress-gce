name: Build

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        default: snapshot
        description: |
          the mode to use. either `snapshot` or `release`. Will affect effective version, as well
          as target-oci-registry.

jobs:
  prepare:
    uses: gardener/cc-utils/.github/workflows/prepare.yaml@v1
    with:
      mode: ${{ inputs.mode }}
    permissions:
      id-token: write

  calculate-version:
    runs-on: ubuntu-latest
    needs:
      - prepare
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: calculate-version
        id: version
        shell: bash
        run: |
          set -eu
          # effective version is used in `Dockerfile` to specify the branch of an external
          # git-repository. Hence, for non-release-builds, we cannot use snapshot-version
          version='${{ needs.prepare.outputs.version }}'
          if [ '${{ inputs.mode }}' == 'snapshot' ]; then
            version="$(echo ${version} | cut -d- -f1)"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  check-release-version-not-exists:
    name: Check Release Version Does Not Exist
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions: {}
    steps:
      - name: check-image-tag-not-exists
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          image_ref="europe-docker.pkg.dev/gardener-project/releases/gardener/extensions/ingress-gce:${{ needs.prepare.outputs.version }}"
          if docker manifest inspect "${image_ref}" > /dev/null 2>&1; then
            echo "ERROR: ${image_ref} already exists — refusing to overwrite a released image tag"
            exit 1
          fi
          echo "OK: ${image_ref} does not yet exist"
  
  read-upstream-commit:
    runs-on: ubuntu-latest
    outputs:
      upstream-commit: ${{ steps.read.outputs.upstream-commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "upstream-commit=$(cat UPSTREAM_COMMIT | tr -d '[:space:]')" >> "${GITHUB_OUTPUT}"

  check-ocm-source-pin:
    name: Check OCM Source Pin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: verify ocm source matches VERSION and UPSTREAM_COMMIT
        run: python3 .github/scripts/check-ocm-source-pin.py
        if: ${{ inputs.mode == 'release' }}

  oci-images:
    name: Build OCI-Images
    needs:
      - prepare
      - calculate-version
      - check-release-version-not-exists
      - read-upstream-commit
      - check-ocm-source-pin
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    uses: gardener/cc-utils/.github/workflows/oci-ocm.yaml@v1
    strategy:
      matrix:
        args:
          - name: ingress-gce
            target:
            oci-repository: gardener/extensions/ingress-gce
    with:
      name: ${{ matrix.args.name }}
      version: ${{ needs.prepare.outputs.version }}
      target: ${{ matrix.args.target }}
      oci-registry: ${{ needs.prepare.outputs.oci-registry }}
      oci-repository: ${{ matrix.args.oci-repository }}
      oci-platforms: linux/amd64,linux/arm64
      extra-tags:
      build-args: |
        EFFECTIVE_VERSION=${{ needs.calculate-version.outputs.version }}
        UPSTREAM_COMMIT=${{ needs.read-upstream-commit.outputs.upstream-commit }}
