name: Build

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        default: snapshot
        description: |
          the mode to use. either `snapshot` or `release`. Will affect effective version, as well
          as target-oci-registry.

jobs:
  upstream-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      commit: ${{ steps.upstream.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test upstream intake
        run: python3 -B .ci/tests/test_upstream.py -v
      - name: Verify and check out upstream release
        id: upstream
        env:
          MODE: ${{ inputs.mode }}
        run: python3 .ci/upstream.py prepare --mode "$MODE" --checkout upstream --output "$GITHUB_OUTPUT"

  prepare:
    uses: gardener/cc-utils/.github/workflows/prepare.yaml@v1
    with:
      mode: ${{ inputs.mode }}
    permissions:
      id-token: write

  check-release-version-not-exists:
    name: Check Release Version Does Not Exist
    runs-on: ubuntu-latest
    needs:
      - prepare
    permissions: {}
    steps:
      - name: check-image-tag-not-exists
        if: ${{ inputs.mode == 'release' }}
        run: |
          set -euo pipefail
          image_ref="europe-docker.pkg.dev/gardener-project/releases/gardener/extensions/ingress-gce:${{ needs.prepare.outputs.version }}"
          if docker manifest inspect "${image_ref}" > /dev/null 2>&1; then
            echo "ERROR: ${image_ref} already exists — refusing to overwrite a released image tag"
            exit 1
          fi
          echo "OK: ${image_ref} does not yet exist"

  oci-images:
    name: Build OCI-Images
    needs:
      - prepare
      - upstream-source
      - check-release-version-not-exists
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    uses: gardener/cc-utils/.github/workflows/oci-ocm.yaml@v1
    strategy:
      matrix:
        args:
          - name: ingress-gce
            target:
            oci-repository: gardener/extensions/ingress-gce
    with:
      name: ${{ matrix.args.name }}
      version: ${{ needs.prepare.outputs.version }}
      target: ${{ matrix.args.target }}
      oci-registry: ${{ needs.prepare.outputs.oci-registry }}
      oci-repository: ${{ matrix.args.oci-repository }}
      oci-platforms: linux/amd64,linux/arm64
      extra-tags:
      build-args: |
        UPSTREAM_VERSION=${{ needs.upstream-source.outputs.version }}
        UPSTREAM_COMMIT=${{ needs.upstream-source.outputs.commit }}
